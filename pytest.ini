# Test configuration for the IR practice repository.
#
# Only week02 has a test suite. week01 is left byte-identical on purpose, so its
# behaviour is still exactly what the committed console output shows.
#
# week02 uses flat imports (from ranking import Bm25Model), not a package, so
# week02/tests/conftest.py puts week02/ on sys.path. Running pytest from the
# repository root is therefore expected:
#
#     uv run pytest
#     .venv\Scripts\python.exe -m pytest

[pytest]
testpaths = week02/tests
addopts = -q --strict-markers
python_files = test_*.py
python_classes = Test*
python_functions = test_*