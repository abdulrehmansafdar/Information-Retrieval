# Test configuration for the IR practice repository.
#
# week02, week03 and week06 each have a test suite. week01 is left byte-identical on
# purpose, so its behaviour is still exactly what the committed console output
# shows, and it has no tests.
#
# Both suites use flat imports (from ranking import Bm25Model, import browsing as
# browse), not packages, so each week's tests/conftest.py puts its folder on
# sys.path. Running pytest from the repository root is therefore expected:
#
#     uv run pytest
#     .venv\Scripts\python.exe -m pytest
#
# Every importable module is uniquely named across the two weeks (week02's
# engine/preprocess/ranking/..., week03's collection/taxonomy/hypertext/browsing),
# so one pytest process can collect them all without shadowing.
#
# week06 reads the shared corpus at corpus/ (the one copy used by week 6 onward),
# so it is the only suite that looks outside its own folder.

[pytest]
testpaths = week02/tests week03/tests week06/tests
addopts = -q --strict-markers
python_files = test_*.py
python_classes = Test*
python_functions = test_*
